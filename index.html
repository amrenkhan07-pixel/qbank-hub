<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172554" />
    <meta name="description" content="A private medical QBank for focused study." />
    <title>QBank Hub</title>
    <link rel="stylesheet" href="./app/styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <main class="shell auth">
        <section class="card">
          <h1>QBank Hub</h1>
          <p class="subtle">Your private medical study workspace.</p>
          <div class="stack">
            <div class="field"><label>Email</label><input class="input" type="email" disabled /></div>
            <div class="field"><label>Password</label><input class="input" type="password" disabled /></div>
            <button class="button" disabled>Loading secure sign in…</button>
          </div>
        </section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./app/app.js"></script>
    <script src="./app/fixes.js"></script>
  </body>
</html>
