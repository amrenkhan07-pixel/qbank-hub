<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambiguous concept clusters</title><style>
body{font:15px system-ui;margin:0;background:#f6f7fb;color:#172033}main{max-width:940px;margin:auto;padding:32px}h1{margin-bottom:6px}.muted{color:#687086}.card{background:white;border:1px solid #dde1ea;border-radius:12px;padding:18px;margin:14px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{padding:12px;background:#f2f4f8;border-radius:8px}button{padding:8px 13px} @media(max-width:650px){.pair{grid-template-columns:1fr}}
</style><main><h1>Ambiguous concept clusters</h1><p class="muted" id="status">Loading only conflicts…</p><section id="items"></section><button id="prev">Previous</button> <button id="next">Next</button></main><script>
let page=1,total=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(x){if(x.kind==='assignment')return `<article class="card"><strong>${esc(x.subject)} · ${esc(x.generated_label)}</strong><p>${esc((x.review_reasons||[]).join(', '))}</p><div class="label">${esc(x.stem)}</div><p>${esc(x.teaching)}</p></article>`;return `<article class="card"><strong>${esc(x.subject)}</strong><p>${esc(x.reason)}</p><div class="pair"><div class="label">${esc(x.left.normalized_label)}<br><small>${x.left.member_count} question(s)</small></div><div class="label">${esc(x.right.normalized_label)}<br><small>${x.right.member_count} question(s)</small></div></div></article>`}async function load(){const d=await fetch('/api/items?page='+page).then(r=>r.json());total=d.total;status.textContent=total?`${total} ambiguous or suspicious nonblank item${total===1?'':'s'} · page ${page}`:'No nonblank items require review.';items.innerHTML=d.items.map(card).join('');prev.disabled=page===1;next.disabled=page*20>=total}prev.onclick=()=>{page--;load()};next.onclick=()=>{page++;load()};load();
</script></html>
