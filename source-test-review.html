<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PrepLadder Source-Test Review</title><style>body{font:14px system-ui;margin:24px;background:#f7f7f5;color:#222}header,article{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:12px}form,.actions,nav{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:8px}small{color:#666}.samples{display:grid;gap:6px;margin-top:10px}.sample{background:#f5f5f2;padding:8px;border-radius:8px}.badge{padding:3px 7px;border-radius:10px;background:#eee}</style></head>
<body><header><h1>PrepLadder Source-Test Topic Review</h1><form><input id="q" placeholder="Search"><select id="subject"><option value="">All subjects</option></select><select id="type"><option value="">All types</option><option>SINGLE_TOPIC</option><option>BROAD_RELATED</option><option>MIXED</option></select><label><input id="exceptions" type="checkbox"> Exceptions only</label></form><p id="status"></p></header><main id="rows"></main><nav><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></nav>
<script>
let page=1,total=0,subjectsLoaded=false;const e=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decide(id,decision){let topic=null;if(decision==='correct_topic')topic=prompt('Enter the corrected existing canonical Topic');if(decision==='correct_topic'&&!topic)return;await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_test_id:id,decision,topic})});load()}
async function load(){const p=new URLSearchParams({page,q:e('q').value,subject:e('subject').value,type:e('type').value,exceptions:e('exceptions').checked?'1':'0'}),d=await fetch('/api/tests?'+p).then(r=>r.json());if(!subjectsLoaded){d.subjects.forEach(s=>e('subject').add(new Option(s,s)));subjectsLoaded=true}total=d.total;e('status').textContent=`${total} matching Source Tests`;e('page').textContent=`Page ${page} of ${Math.max(1,Math.ceil(total/25))}`;e('rows').innerHTML=d.items.map(r=>`<article><h2>${esc(r.source_test)}</h2><p><b>${esc(r.subject)}</b> · <span class=badge>${r.type}</span> · ${esc(r.proposed_topic||'No locked Topic')} · confidence ${(r.confidence*100).toFixed(1)}% · support ${r.dominant_support_percent}%</p><small>${r.sample_size} sampled · runner-up ${esc(r.runner_up_topic||'none')} · decision ${esc(r.review_decision?.decision||'unreviewed')}</small><div class=samples>${r.samples.map(s=>`<div class=sample><b>${esc(s.candidate_topic||'unresolved')}</b><br>${esc(s.stem)}<br><small>${esc(s.explanation)}</small></div>`).join('')}</div><div class=actions><button onclick="decide('${r.source_test_id}','accept')">Accept</button><button onclick="decide('${r.source_test_id}','correct_topic')">Correct Topic</button><button onclick="decide('${r.source_test_id}','mixed')">Mark MIXED</button><button onclick="decide('${r.source_test_id}','broad_related')">Mark BROAD_RELATED</button><button onclick="decide('${r.source_test_id}','defer')">Defer</button></div></article>`).join('')}
['q','subject','type','exceptions'].forEach(id=>e(id).oninput=()=>{page=1;load()});e('prev').onclick=()=>{if(page>1){page--;load()}};e('next').onclick=()=>{if(page*25<total){page++;load()}};load();
</script></body></html>
