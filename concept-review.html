<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Concept-Key Review</title><style>body{font:14px system-ui;margin:24px;background:#f7f7f5}header,article{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}form,.actions,nav{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:8px}.teaching{background:#f3f3ef;padding:10px;border-radius:8px}.candidate{font-size:18px;font-weight:650}</style></head><body><header><h1>Concept-Key exception review</h1><form><input id=q placeholder="Search question, source, candidate"><select id=subject><option value="">All subjects</option></select></form><p id=status></p></header><main id=rows></main><nav><button id=prev>Previous</button><span id=page></span><button id=next>Next</button></nav><script>
let p=1,total=0,loaded=false;const e=x=>document.getElementById(x),h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function decide(id,action){let value=null;if(action==='link_existing')value=prompt('Existing Concept ID or canonical name');if(action==='rename')value=prompt('Normalized candidate phrase');if((action==='link_existing'||action==='rename')&&!value)return;await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:id,action,value})});load()}async function load(){const q=new URLSearchParams({page:p,q:e('q').value,subject:e('subject').value}),d=await fetch('/api/items?'+q).then(r=>r.json());if(!loaded){d.subjects.forEach(s=>e('subject').add(new Option(s,s)));loaded=true}total=d.total;e('status').textContent=`${total} candidate/conflict exceptions`;e('page').textContent=`Page ${p} of ${Math.max(1,Math.ceil(total/25))}`;e('rows').innerHTML=d.items.map(x=>`<article><b>${h(x.subject)}</b> · ${h(x.source_test)} · position ${h(x.source_position)}<h2>${h(x.diagnostic.stem)}</h2><div class=teaching>${h(x.diagnostic.teaching)}</div><p class=candidate>${h(x.canonical_concept||x.concept_candidate?.normalized_phrase||'No proposed concept')}</p><small>confidence ${(x.confidence*100).toFixed(1)}% · ${h(x.review_reason)} · decision ${h(x.decision?.action||'unreviewed')}</small><div class=actions><button onclick="decide('${x.question_id}','link_existing')">Link existing</button><button onclick="decide('${x.question_id}','accept_candidate')">Accept candidate</button><button onclick="decide('${x.question_id}','rename')">Rename</button><button onclick="decide('${x.question_id}','defer')">Defer</button><button onclick="decide('${x.question_id}','no_concept')">No Concept needed</button></div></article>`).join('')}['q','subject'].forEach(id=>e(id).oninput=()=>{p=1;load()});e('prev').onclick=()=>{if(p>1){p--;load()}};e('next').onclick=()=>{if(p*25<total){p++;load()}};load();
</script></body></html>
